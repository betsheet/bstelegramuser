[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bstelegramuser"
version = "0.1.0"
description = "Telegram client to process channel messages and send them to HTTP endpoints"
requires-python = ">=3.13"
authors = [
    {name = "BetSheet", email = "betsheet@protonmail.com"}
]
keywords = ["telegram", "client", "api", "betsheet"]

dependencies = [
    "pydantic",
    "requests>=2.31.0",
    "telethon>=1.34.0",
    "bsutils @ git+ssh://git@github.com/betsheet/bsutils.git",
    "bs-api-models @ git+ssh://git@github.com/betsheet/bs-api-models.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "python-dotenv>=1.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=1.0.0",
    "bsutils @ git+ssh://git@github.com/betsheet/bsutils.git"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bstelegramuser", "bstelegramuser.*"]


[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  __pycache__
)/
'''

[tool.mypy]
python_version = ">=3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
